name: TryHackMe Update Badge

on:
  schedule:
    # Berjalan otomatis setiap 24 jam (jam 12 malam)
    - cron: '0 0 * * *'
  workflow_dispatch: # Mengizinkan tombol manual "Run workflow"

permissions:
  contents: write # Izin krusial agar GitHub bisa menyimpan file gambar

jobs:
  update-badge:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4 # Menggunakan v4 yang mendukung Node versi terbaru

      - name: Create assets folder if not exists
        run: mkdir -p assets

      - name: Download Newest TryHackMe Badge
        run: |
          curl -sL "https://tryhackme.com" -o assets/tryhackme-badge.png

      - name: Commit and Push Badge
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/tryhackme-badge.png
          git diff-index --quiet HEAD || git commit -m "Update TryHackMe badge image"
          git push
